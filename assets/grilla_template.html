<main class="pf-layout">

  <aside class="pf-side">
    <h1>Portafolio</h1>
    <p id="pf-bajada">Proyectos de análisis de datos, de principio a fin.</p>

    <nav class="pf-temas" id="pf-temas">
{{temas}}
    </nav>

    <div class="pf-contador" id="pf-contador">{{contador}}</div>
  </aside>

  <div class="pf-main">

  <div class="search-box pf-buscador-top">
    <input type="text" id="pf-buscador" placeholder="Buscar por herramienta, fuente o tema..." autocomplete="off" />
  </div>

  <section class="pf-lista" id="pf-lista">

{{cards}}

    <p class="pf-vacio" id="pf-vacio" hidden>Ningún caso coincide con la búsqueda.</p>
  </section>

  </div>

</main>

<script>
(function () {
  const filtros  = document.querySelectorAll('.pf-tema[data-tema]');
  const cards    = document.querySelectorAll('.pf-card');
  const vacio    = document.getElementById('pf-vacio');
  const contador = document.getElementById('pf-contador');
  const buscador = document.getElementById('pf-buscador');

  let tema = 'todos';
  let consulta  = '';

  const normalizar = t => t.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');

  cards.forEach(c => { c.dataset.texto = normalizar(c.innerText); });

  function aplicar() {
    let visibles = 0;

    cards.forEach(card => {
      const porTema = tema === 'todos' || (card.dataset.temas || '').split(' ').includes(tema);
      const porTexto     = !consulta || card.dataset.texto.includes(consulta);
      const mostrar      = porTema && porTexto;

      card.classList.toggle('oculta', !mostrar);
      if (mostrar) visibles++;
    });

    vacio.hidden = visibles > 0;
    contador.textContent = visibles === 1 ? '1 caso' : visibles + ' casos';
  }

  filtros.forEach(btn => btn.addEventListener('click', () => {
    tema = btn.dataset.tema;
    filtros.forEach(b => b.classList.toggle('activo', b === btn));
    aplicar();

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'portafolio_filtro', tema: tema });
  }));

  let temporizador;
  buscador.addEventListener('input', () => {
    consulta = normalizar(buscador.value.trim());
    aplicar();

    clearTimeout(temporizador);
    if (consulta.length >= 3) {
      temporizador = setTimeout(() => {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({ event: 'portafolio_busqueda', termino: consulta });
      }, 900);
    }
  });

  cards.forEach((card, i) => card.addEventListener('click', () => {
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({
      event: 'portafolio_proyecto_click',
      slug: card.dataset.slug,
      categoria: card.dataset.cat,
      posicion: i + 1
    });
  }));
})();
</script>

</body>
</html>
