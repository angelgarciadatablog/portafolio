<!-- ============ OVERLAY DE CÓDIGO ============ -->
<div class="cs-overlay" id="cs-overlay">
  <div class="cs-panel">
    <div class="cs-panel-head">
      <h4 id="cs-panel-titulo">Consulta SQL</h4>
      <div class="cs-panel-acciones">
        <button class="cs-panel-btn" id="cs-copiar">Copiar</button>
        <button class="cs-panel-btn" id="cs-descargar">Descargar</button>
        <button class="cs-panel-btn" id="cs-cerrar">Cerrar</button>
      </div>
    </div>
    <pre><code id="cs-codigo"></code></pre>
  </div>
</div>

{{bloques_sql}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function () {
  const overlay  = document.getElementById('cs-overlay');
  const codigo   = document.getElementById('cs-codigo');
  const titulo   = document.getElementById('cs-panel-titulo');
  const slug     = '{{slug}}';
  let nombreArchivo = 'consulta.sql';

  // El lenguaje sale de la extension del archivo, no se asume SQL
  const LENGUAJES = {
    sql: 'sql', py: 'python', sh: 'bash', bash: 'bash', js: 'javascript',
    json: 'json', yaml: 'yaml', yml: 'yaml', html: 'xml', css: 'css', md: 'markdown'
  };
  const extension = a => (a.split('.').pop() || '').toLowerCase();

  const dl = o => { window.dataLayer = window.dataLayer || []; window.dataLayer.push(o); };

  // Si highlight.js no carga, el codigo se muestra igual, sin color.
  function resaltar(texto, archivo) {
    codigo.textContent = texto;
    codigo.className = 'language-' + (LENGUAJES[extension(archivo)] || 'plaintext');
    delete codigo.dataset.highlighted;
    if (window.hljs) hljs.highlightElement(codigo);
  }

  function abrir(id) {
    const fuente = document.getElementById(id);
    if (!fuente) return;
    nombreArchivo   = fuente.dataset.titulo || 'consulta.sql';
    titulo.textContent = nombreArchivo;
    resaltar(fuente.textContent.trim(), nombreArchivo);
    document.getElementById('cs-descargar').textContent = 'Descargar .' + extension(nombreArchivo);
    overlay.classList.add('abierto');
    document.body.style.overflow = 'hidden';
    dl({ event: 'caso_ver_sql', slug: slug, consulta: nombreArchivo });
  }

  function cerrar() {
    overlay.classList.remove('abierto');
    document.body.style.overflow = '';
  }

  document.querySelectorAll('[data-sql]').forEach(b =>
    b.addEventListener('click', () => abrir(b.dataset.sql)));

  document.getElementById('cs-cerrar').addEventListener('click', cerrar);
  overlay.addEventListener('click', e => { if (e.target === overlay) cerrar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrar(); });

  document.getElementById('cs-copiar').addEventListener('click', async function () {
    await navigator.clipboard.writeText(codigo.textContent);
    this.textContent = 'Copiado';
    setTimeout(() => { this.textContent = 'Copiar'; }, 1600);
    dl({ event: 'caso_copiar_sql', slug: slug, consulta: nombreArchivo });
  });

  document.getElementById('cs-descargar').addEventListener('click', () => {
    const blob = new Blob([codigo.textContent], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombreArchivo;
    a.click();
    URL.revokeObjectURL(a.href);
    dl({ event: 'caso_descargar_sql', slug: slug, consulta: nombreArchivo });
  });

  document.querySelectorAll('.cs-accion').forEach(a =>
    a.addEventListener('click', () =>
      dl({ event: 'caso_salida', slug: slug, destino: a.dataset.destino })));

  // indice de secciones
  const lista    = document.getElementById('cs-toc-lista');
  const titulos  = [...document.querySelectorAll('#cs-body h2')];
  const enlaces  = [];

  titulos.forEach((h, i) => {
    h.id = h.id || 'sec-' + i;
    const li = document.createElement('li');
    const a  = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent;
    li.appendChild(a);
    lista.appendChild(li);
    enlaces.push(a);
  });

  const observador = new IntersectionObserver(entradas => {
    entradas.forEach(e => {
      if (!e.isIntersecting) return;
      const i = titulos.indexOf(e.target);
      enlaces.forEach((a, j) => a.classList.toggle('activo', j === i));
    });
  }, { rootMargin: '-88px 0px -70% 0px' });

  titulos.forEach(h => observador.observe(h));
})();
</script>

</body>
